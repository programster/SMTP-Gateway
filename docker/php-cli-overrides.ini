; Settings for PHP on the command line: the cron jobs (cleanup.php and remove-attachments.php) and the scripts run by
; hand. Without a limit, a job that went wrong could take memory the SMTP server, PHP-FPM or PostgreSQL need. 256 MB
; is far more than the jobs use: removing an email's attachments needs about 3 times the email's size, plus PHP's
; own 28 MB, so this covers emails of up to about 76 MB (the Settings page warns if SMTP_MAX_MESSAGE_BYTES is larger).
; The SMTP server and the queue workers are given PHP_MEMORY_LIMIT instead, in supervisord.conf, as -d overrides this.
memory_limit = 256M

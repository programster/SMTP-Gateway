[supervisord]
nodaemon=true
user=root
logfile=/logs/supervisor/supervisor.log
logfile_maxbytes=10MB
logfile_backups=10
childlogdir=/logs/supervisor
pidfile=/var/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:php-fpm]
command=/usr/sbin/php-fpm8.5 --nodaemonize --fpm-config /etc/php/8.5/fpm/php-fpm.conf
autostart=true
autorestart=true
startretries=999999
startsecs=5
user=root
priority=90
stopasgroup=true
killasgroup=true
stopsignal=QUIT
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/logs/supervisor/php-fpm.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=10

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=999999
startsecs=5
user=root
priority=100
stopasgroup=true
killasgroup=true
stopsignal=QUIT
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/logs/supervisor/nginx.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=10

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
startretries=3
startsecs=5
user=root
priority=50
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/logs/supervisor/cron.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=10

# Runs as root only to open ports 465 and 587, then drops to www-data before accepting any connection.
[program:smtp-server]
command=/usr/bin/php -d memory_limit=%(ENV_PHP_MEMORY_LIMIT)s /var/www/site/scripts/smtp-server.php
autostart=true
autorestart=true
startretries=999999
startsecs=5
user=root
priority=200
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/logs/supervisor/smtp-server.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=10

# The workers that send every email to the providers. QUEUE_WORKERS of them are run (4 by default, exported by
# startup.sh). Workers never claim the same email, and between them never send more than the rate limits allow.
# Each, like each SMTP connection, can use up to PHP_MEMORY_LIMIT, rather than the command line's own 256 MB (see
# php-cli-overrides.ini), which is for the cron jobs and scripts run by hand.
[program:queue-worker]
command=/usr/bin/php -d memory_limit=%(ENV_PHP_MEMORY_LIMIT)s /var/www/site/scripts/queue-worker.php
process_name=%(program_name)s_%(process_num)02d
numprocs=%(ENV_QUEUE_WORKERS)s
autostart=true
autorestart=true
startretries=999999
startsecs=5
user=www-data
priority=200
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/logs/supervisor/queue-worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=10

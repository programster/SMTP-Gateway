; The PHP-FPM pool that runs the web interface and the API. "ondemand" starts PHP processes as requests arrive,
; up to PHP_FPM_MAX_CHILDREN (8 by default, each around 20 to 30 MB), and stops them once they've been idle for
; 30 seconds, so an idle server uses almost no memory for PHP. The Settings page suggests values for this server.
; The ${...} values are exported by startup.sh (see write-runtime-config.php), so they've been checked, and have
; their defaults if .env doesn't set them.
[www]
user = www-data
group = www-data
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.process_idle_timeout = 30s
pm.max_requests = 1000

; The largest request (HTTP_MAX_BODY_SIZE, which nginx is given too), and the most memory a request can use.
php_admin_value[post_max_size] = ${HTTP_MAX_BODY_SIZE}
php_admin_value[upload_max_filesize] = ${HTTP_MAX_BODY_SIZE}
php_admin_value[memory_limit] = ${PHP_MEMORY_LIMIT}

; Keep the container's environment, so providers.yaml's "${ENV_VAR}" references can be read.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /logs/php-fpm-error.log

; Settings for the web interface and the API (PHP-FPM). Display errors is on, as the application decides whether
; to show the details based on ENVIRONMENT. The memory and request size limits are set from .env, in
; php-fpm-pool.conf.
display_errors = On
expose_php = Off

; OPcache keeps the compiled code in memory, shared by every PHP-FPM process. 32 MB is plenty for this codebase.
opcache.enable = 1
opcache.memory_consumption = 32
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

# This will become the crontab file. Place any crons that need performing in here.

# Delete whatever is past its retention period: emails' records, content and attachments, rejected requests, and
# logs (as the retention settings on the Settings page say).
15 3 * * * su --shell /bin/sh www-data --command "/usr/bin/php /var/www/site/scripts/cleanup.php" >> /logs/cleanup.log 2>&1

# Remove the attachments that are no longer to be kept from emails' content (as the retention settings say). flock
# skips a run while the last one is still going.
*/5 * * * * su --shell /bin/sh www-data --command "flock --nonblock /tmp/remove-attachments.lock /usr/bin/php /var/www/site/scripts/remove-attachments.php" >> /logs/remove-attachments.log 2>&1

# Fetch Cloudflare's address ranges again (when the site is behind Cloudflare), in case Cloudflare has changed them.
40 */6 * * * su --shell /bin/sh www-data --command "/usr/bin/php /var/www/site/scripts/update-cloudflare-networks.php" >> /logs/update-cloudflare-networks.log 2>&1

# Pick up a renewed SMTP TLS certificate.
5 * * * * /bin/bash /root/prepare-smtp-tls.sh >> /logs/prepare-smtp-tls.log 2>&1

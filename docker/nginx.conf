# nginx in front of PHP-FPM. Sized for a small server: one worker process handles thousands of connections, and
# only requests for PHP use a PHP-FPM process. TLS is expected to be handled by a reverse proxy (e.g. Traefik) in
# front of the container, which should send X-Forwarded-For and X-Forwarded-Proto (see TRUSTED_PROXIES).
user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /logs/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    access_log /logs/nginx-access.log;

    gzip on;
    gzip_types text/css application/javascript application/json application/yaml image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        root /var/www/site/public;

        # The largest request, which the send endpoint needs for emails with attachments, up to
        # SMTP_MAX_MESSAGE_BYTES (base64 makes them larger). It's HTTP_MAX_BODY_SIZE, written by startup.sh.
        include /run/nginx-limits.conf;

        # The JavaScript modules import each other, so a ?v= cache-buster on a page's script tag wouldn't reach the
        # modules it imports. Browsers revalidate them instead, which only costs a 304 when they haven't changed.
        location /js/ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location /css/ {
            try_files $uri =404;
        }

        # Everything else goes to the front controller. No other PHP file can be run, so nothing uploaded or left
        # in public/ could ever be executed.
        location / {
            try_files $uri /index.php$is_args$args;
        }

        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_read_timeout 120s;
        }

        location ~ \.php$ {
            return 404;
        }
    }
}

# The development stack, for testing the gateway without sending any real email. It bind-mounts the site so
# changes show straight away, runs the TypeScript compiler in watch mode, and relays every email to one of two Mailpit
# containers (Mailpit is the maintained successor to MailHog), which catch them all instead of sending them:
#  - "mailpit", the primary provider, at http://localhost:8025 (or MAILPIT_HOST_PORT), and
#  - "mailpit-secondary", at http://localhost:8026 (or MAILPIT_SECONDARY_HOST_PORT),
# so the overflow and fallback modes can be tried. Both have Mailpit's "Chaos" turned on: in its web interface (or
# with PUT /api/v1/chaos), it can be made to refuse emails with an error code of your choosing, e.g. to pretend the
# primary is throttling you, or is down.
#
# The settings come from config-dev/settings.yaml, not ./config, so this stack only ever relays to Mailpit, even with
# a production .env, unless config-dev/settings.yaml is deliberately changed.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-app
    image: ${DOCKER_IMAGE_NAME}
    restart: always
    ports:
      - "${WEB_HOST_PORT:-80}:80"
      - "${SMTPS_HOST_PORT:-465}:465"
      - "${SUBMISSION_HOST_PORT:-587}:587"
    depends_on:
        - db
        - mailpit
        - mailpit-secondary
    volumes:
      - ./site:/var/www/site
      # The documentation, which the web interface shows, so changes to it show straight away too.
      - ./README.md:/var/www/documentation/README.md:ro
      - ./docs:/var/www/documentation/docs:ro
      - ./logs:/logs
      - ./tls:/tls:ro
      # The dev stack's own settings.yaml, whose providers only relay to the two Mailpit containers below.
      - ./config-dev:/config
    # Everything in .env is passed in, so that settings.yaml can refer to any variable in it (as "${NAME}").
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT
      - DB_USER
      - DB_PASSWORD
      - DB_NAME
      - DB_HOST=db
      - HOST_USER_ID
      - HOST_GROUP_ID
      - ADMIN_EMAIL
      - ADMIN_PASSWORD_HASH
      - PUBLIC_URL
      - SMTP_SERVER_HOSTNAME
      - SMTP_TLS_CERT_FILE
      - SMTP_TLS_KEY_FILE
      - SMTP_MAX_MESSAGE_BYTES
      - QUEUE_WORKERS
      - PHP_FPM_MAX_CHILDREN
      - SMTP_MAX_CONNECTIONS
      - HTTP_MAX_BODY_SIZE
      - PHP_MEMORY_LIMIT
      # Only used by the app to show the memory left for itself, and suggest the limits, on the Settings page.
      - DB_MEMORY_LIMIT
      # Only set by the tests, to start a stack with no settings (e.g. /config/fresh.yaml), as a fresh install does.
      - SETTINGS_FILE

  typescript:
    image: node:22-bookworm-slim
    container_name: ${COMPOSE_PROJECT_NAME}-typescript
    working_dir: /site
    user: "${HOST_USER_ID:-1000}:${HOST_GROUP_ID:-1000}"
    volumes:
      - ./site:/site
    command: ["sh", "-c", "npm install --no-audit --no-fund && npx tsc -p tsconfig.json --watch --preserveWatchOutput"]

  # Catch every email the gateway relays, and show them in their web interfaces. Their SMTP ports (1025) are only
  # reachable from the app, on the stack's own network.
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: ${COMPOSE_PROJECT_NAME}-mailpit
    restart: always
    command: ["--enable-chaos"]
    ports:
      - "${MAILPIT_HOST_PORT:-8025}:8025"

  mailpit-secondary:
    image: axllent/mailpit:v1.33.1
    container_name: ${COMPOSE_PROJECT_NAME}-mailpit-secondary
    restart: always
    command: ["--enable-chaos"]
    ports:
      - "${MAILPIT_SECONDARY_HOST_PORT:-8026}:8025"

  db:
    image: postgres:18-trixie
    container_name: ${COMPOSE_PROJECT_NAME}-db
    restart: always
    # Set from .env, with defaults that suit a server with 1 GB of memory (the same as ResourceVariable's, in the
    # app). The Settings page suggests values for this server. max_connections must cover every process that can
    # connect at once: the PHP-FPM processes, the queue workers and the SMTP connections, each of which may also
    # open a second connection for logging. The memory limit is a hard cap, so PostgreSQL can't take memory the app
    # needs.
    mem_limit: ${DB_MEMORY_LIMIT:-384M}
    command:
      - postgres
      - -c
      - max_connections=${DB_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${DB_SHARED_BUFFERS:-64MB}
      - -c
      - effective_cache_size=${DB_EFFECTIVE_CACHE_SIZE:-256MB}
      - -c
      - work_mem=${DB_WORK_MEM:-2MB}
      - -c
      - maintenance_work_mem=${DB_MAINTENANCE_WORK_MEM:-32MB}
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql


volumes:
  db-data:
    driver: local
